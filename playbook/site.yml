---
- name: Install ClickHouse
  hosts: clickhouse
  become: true

  handlers:
    - name: Restart ClickHouse
      ansible.builtin.systemd:
        name: clickhouse-server
        state: restarted
        daemon_reload: true
      when: not ansible_check_mode

  tasks:
    - name: Download ClickHouse common-static package
      ansible.builtin.get_url:
        url: "https://packages.clickhouse.com/deb/pool/main/c/clickhouse-common-static/clickhouse-common-static_{{ clickhouse_version }}_amd64.deb"
        dest: "/tmp/clickhouse-common-static_{{ clickhouse_version }}_amd64.deb"
        mode: "0644"

    - name: Download ClickHouse client package
      ansible.builtin.get_url:
        url: "https://packages.clickhouse.com/deb/pool/main/c/clickhouse-client/clickhouse-client_{{ clickhouse_version }}_all.deb"
        dest: "/tmp/clickhouse-client_{{ clickhouse_version }}_all.deb"
        mode: "0644"

    - name: Download ClickHouse server package
      ansible.builtin.get_url:
        url: "https://packages.clickhouse.com/deb/pool/main/c/clickhouse-server/clickhouse-server_{{ clickhouse_version }}_all.deb"
        dest: "/tmp/clickhouse-server_{{ clickhouse_version }}_all.deb"
        mode: "0644"

    - name: Install ClickHouse common-static package
      ansible.builtin.apt:
        deb: "/tmp/clickhouse-common-static_{{ clickhouse_version }}_amd64.deb"
      when: not ansible_check_mode

    - name: Install ClickHouse client package
      ansible.builtin.apt:
        deb: "/tmp/clickhouse-client_{{ clickhouse_version }}_all.deb"
      when: not ansible_check_mode

    - name: Install ClickHouse server package
      ansible.builtin.apt:
        deb: "/tmp/clickhouse-server_{{ clickhouse_version }}_all.deb"
      notify: Restart ClickHouse
      when: not ansible_check_mode

    - name: Flush ClickHouse handlers
      ansible.builtin.meta: flush_handlers
      when: not ansible_check_mode

    - name: Ensure ClickHouse service is started
      ansible.builtin.systemd:
        name: clickhouse-server
        state: started
        enabled: true
      when: not ansible_check_mode

    - name: Wait for ClickHouse to start
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9000
        delay: 2
        timeout: 60
      when: not ansible_check_mode

    - name: Create ClickHouse database
      ansible.builtin.command:
        cmd: clickhouse-client -q "CREATE DATABASE IF NOT EXISTS logs"
      register: create_db
      retries: 5
      delay: 3
      until: create_db.rc == 0
      changed_when: false
      when: not ansible_check_mode


- name: Install Vector
  hosts: vector
  become: true

  handlers:
    - name: Restart Vector
      ansible.builtin.systemd:
        name: vector
        state: restarted
        daemon_reload: true
      when: not ansible_check_mode

  tasks:
    - name: Create Vector user
      ansible.builtin.user:
        name: vector
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create Vector installation directory
      ansible.builtin.file:
        path: "{{ vector_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create Vector configuration directory
      ansible.builtin.file:
        path: "{{ vector_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create Vector data directory
      ansible.builtin.file:
        path: "{{ vector_data_dir }}"
        state: directory
        owner: vector
        group: vector
        mode: "0755"
      when: not ansible_check_mode

    - name: Download Vector
      ansible.builtin.get_url:
        url: "https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-gnu.tar.gz"
        dest: "/tmp/vector-{{ vector_version }}.tar.gz"
        mode: "0644"

    - name: Unpack Vector
      ansible.builtin.unarchive:
        src: "/tmp/vector-{{ vector_version }}.tar.gz"
        dest: "{{ vector_install_dir }}"
        remote_src: true
        creates: "{{ vector_install_dir }}/vector-x86_64-unknown-linux-gnu/bin/vector"
      when: not ansible_check_mode

    - name: Create Vector binary symlink
      ansible.builtin.file:
        src: "{{ vector_install_dir }}/vector-x86_64-unknown-linux-gnu/bin/vector"
        dest: /usr/local/bin/vector
        state: link
        force: true
      notify: Restart Vector
      when: not ansible_check_mode

    - name: Deploy Vector configuration
      ansible.builtin.template:
        src: vector.yml.j2
        dest: "{{ vector_config_dir }}/vector.yml"
        owner: vector
        group: vector
        mode: "0644"
      notify: Restart Vector
      when: not ansible_check_mode

    - name: Create Vector systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/vector.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Vector
          Documentation=https://vector.dev
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=vector
          Group=vector
          ExecStart=/usr/local/bin/vector --config {{ vector_config_dir }}/vector.yml
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart Vector

    - name: Enable and start Vector
      ansible.builtin.systemd:
        name: vector
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode


- name: Install LightHouse
  hosts: lighthouse
  become: true

  handlers:
    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        daemon_reload: true
      when: not ansible_check_mode

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create LightHouse directory
      ansible.builtin.file:
        path: "{{ lighthouse_dir }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"
      when: not ansible_check_mode

    - name: Download LightHouse archive
      ansible.builtin.get_url:
        url: "{{ lighthouse_archive_url }}"
        dest: "{{ lighthouse_archive_path }}"
        mode: "0644"

    - name: Unpack LightHouse
      ansible.builtin.unarchive:
        src: "{{ lighthouse_archive_path }}"
        dest: "{{ lighthouse_dir }}"
        remote_src: true
        extra_opts:
          - "--strip-components=1"
        creates: "{{ lighthouse_dir }}/index.html"
      when: not ansible_check_mode

    - name: Deploy LightHouse Nginx configuration
      ansible.builtin.template:
        src: lighthouse.conf.j2
        dest: /etc/nginx/sites-available/lighthouse
        owner: root
        group: root
        mode: "0644"
      notify: Restart Nginx
      when: not ansible_check_mode

    - name: Disable default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart Nginx
      when: not ansible_check_mode

    - name: Enable LightHouse Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/lighthouse
        dest: /etc/nginx/sites-enabled/lighthouse
        state: link
      notify: Restart Nginx
      when: not ansible_check_mode

    - name: Check Nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      register: nginx_test
      changed_when: false
      when: not ansible_check_mode

    - name: Ensure Nginx is enabled and started
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true
      when: not ansible_check_mode
